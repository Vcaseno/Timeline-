<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-image: url('bg.jpg') !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.7);
        }
        .date {
            font-size: 1.5rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .clock {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        #time-box {
            font-size: 6.5rem;
            font-weight: bold;
            line-height: 1;
        }
        .seconds {
            font-size: 2.2rem;
            margin-left: 10px;
            margin-top: 10px;
            opacity: 0.8;
        }
        .footer {
            position: absolute;
            bottom: 40px;
            font-size: 1.2rem;
            text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="date" id="date-box">2026年8月12日 星期三</div>
        <div class="clock">
            <span id="time-box">00:00</span>
            <span class="seconds" id="seconds-box">00</span>
        </div>
    </div>

    <div class="footer" id="greeting-box"></div>

    <script>
        function updateClock() {
            const now = new Date();

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('time-box').textContent = `${hours}:${minutes}`;
            document.getElementById('seconds-box').textContent = seconds;

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dayName = days[now.getDay()];
            
            document.getElementById('date-box').textContent = `${year}年${month}月${date}日 ${dayName}`;

            const hr = now.getHours();
            let greeting = "你好";
            if (hr >= 5 && hr < 12) greeting = "上午好 🌅";
            else if (hr >= 12 && hr < 18) greeting = "下午好 ☀️";
            else greeting = "晚上好 🌙";
            
            document.getElementById('greeting-box').textContent = greeting;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
