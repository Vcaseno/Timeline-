<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer; /* Shows screen is clickable */
        }

        .container {
            text-align: center;
            z-index: 2; /* Keeps clock text above the clickable background */
            pointer-events: none; /* Allows clicks to pass through text elements */
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.7); /* Ensures text stays readable on any photo */
        }
        .date {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        .clock {
            font-size: 7.5rem;
            font-weight: 300;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .seconds {
            font-size: 2.5rem;
            margin-top: 1.5rem;
            margin-left: 5px;
            opacity: 0.8;
        }
        .footer {
            position: absolute;
            bottom: 40px;
            font-size: 1rem;
            opacity: 0.8;
            z-index: 2;
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.7);
        }
        /* Completely hidden native file input */
        #gallery-input {
            display: none;
        }
    </style>
</head>
<body>

    

    <div class="container">
        <div class="date" id="date-box"></div>
        <div class="clock">
            <span id="time-box">00:00</span>
            <span class="seconds" id="seconds-box">00</span>
        </div>
    </div>

    <div class="footer" id="greeting-box"></div>

    <script>
        // --- 1. Clock Engine Logic ---
        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time-box').textContent = `${hours}:${minutes}`;
            document.getElementById('seconds-box').textContent = seconds;

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dayName = days[now.getDay()];
            document.getElementById('date-box').textContent = `${year}年${month}月${date}日 ${dayName}`;

            const hr = now.getHours();
            let greeting = "你好";
            if (hr >= 5 && hr < 12) greeting = "上午好 🌅";
            else if (hr >= 12 && hr < 18) greeting = "下午好 ☀️";
            else greeting = "晚上好 🌙";
            document.getElementById('greeting-box').textContent = greeting;
        }

        updateClock();
        setInterval(updateClock, 1000);

        
            
    
    </script>
</body>
</html>
